org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
# Reduce parallel workers to avoid daemon OOM/crashes on some machines
org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
